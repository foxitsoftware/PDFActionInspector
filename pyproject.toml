[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-action-inspector"
version = "0.1.0"
authors = [
    {name = "Foxit Software Inc.", email = "security-ml@foxitsoftware.com"},
]
description = "A Model Context Protocol server for extracting and analyzing JavaScript Actions from PDF files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = ["pdf", "security", "analysis", "javascript", "actions", "mcp", "model-context-protocol"]
dependencies = [
    "PyPDF2>=3.0.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=0.8.0",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/foxitsoftware/PDFActionInspector"
Repository = "https://github.com/foxitsoftware/PDFActionInspector"
Issues = "https://github.com/foxitsoftware/PDFActionInspector/issues"
Documentation = "https://github.com/foxitsoftware/PDFActionInspector#readme"

[project.scripts]
pdf-action-inspector = "pdf_action_inspector.mcp_server:main"

[tool.setuptools]
packages = ["pdf_action_inspector", "pdf_action_inspector.config", "pdf_action_inspector.core", "pdf_action_inspector.utils"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yml", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:PyPDF2.*"
]
